name: cloud-native-mall

services:
  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    volumes:
      - ./user-service/data:/app/data

  product-service:
    build: ./product-service
    ports:
      - "8002:8002"
    volumes:
      - ./product-service/data:/app/data

  order-service:
    build: ./order-service
    ports:
      - "8003:8003"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - PRODUCT_SERVICE_URL=http://product-service:8002
    volumes:
      - ./order-service/data:/app/data
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "80:80"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
