<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的订单 - 云商城</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="nav">
        <div class="nav-inner">
            <div class="logo"><a href="index.html">云商城</a></div>
            <div class="nav-menu">
                <a href="index.html">商品首页</a>
                <a href="cart.html">购物车</a>
                <a href="orders.html">我的订单</a>
            </div>
            <div class="user-info" id="userInfo">
                <a href="login.html">登录</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 style="margin: 20px 0;">我的订单</h2>
        <div id="orderBox"></div>
    </div>

<script>
const user = JSON.parse(localStorage.getItem('user') || 'null');
if (user) {
    document.getElementById('userInfo').innerHTML = `欢迎，${user.username} <a href="#" onclick="logout()">退出</a>`;
} else {
    alert('请先登录');
    location.href = 'login.html?redirect=orders.html';
}

function logout() {
    localStorage.removeItem('user');
    location.href = 'login.html';
}

function loadOrders() {
    fetch(`/api/order/list/${user.id}`)
        .then(r => r.json())
        .then(res => {
            const list = res.data;
            if (list.length === 0) {
                document.getElementById('orderBox').innerHTML = '<div class="tip">暂无订单</div>';
                return;
            }

            let html = `
            <table class="order-table">
                <thead>
                    <tr>
                        <th>订单号</th>
                        <th>商品</th>
                        <th>数量</th>
                        <th>总价</th>
                        <th>状态</th>
                        <th>下单时间</th>
                    </tr>
                </thead>
                <tbody>`;
            
            list.forEach(o => {
                html += `
                <tr>
                    <td>#${o.id}</td>
                    <td>${o.product_name}</td>
                    <td>${o.num}</td>
                    <td style="color:#f56c6c;">¥${o.total_price}</td>
                    <td>${o.status === 'created' ? '已创建' : o.status}</td>
                    <td>${o.create_time}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('orderBox').innerHTML = html;
        });
}

loadOrders();
</script>
</body>
</html>
